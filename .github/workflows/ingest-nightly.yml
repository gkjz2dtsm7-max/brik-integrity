name: Nightly USAspending ingest (Gulf FL + MS)
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC ≈ 2am ET
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r ingest/requirements.txt
      - name: Run ingest
        env:
          # Direct Supabase URI is fine. Ingest derives IPv4 session-pooler
          # URLs from this secret; do not change the secret for runners.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python ingest/usaspending_gulf_ms.py
      - name: Commit prior award IDs
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ingest/out/prior_award_ids.json
          if git diff --cached --quiet; then
            echo "prior award ids unchanged"
            exit 0
          fi
          git commit -m "Update USAspending prior award IDs"
          git push origin HEAD:main
      - name: Upload JSONL artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usaspending-gulf-ms
          path: ingest/out/
