<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BRIK Integrity + BRIK Proof</title>
<style>
:root{--bg:#000;--ink:#f4f4f4;--red:#e10600;--yellow:#ffd100;--mute:#9a9a9a;--line:#222}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial Narrow,Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:flex-end;padding:18px 22px;border-bottom:4px solid var(--yellow);gap:12px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.08em;font-size:22px}.brand span{color:var(--red)}
nav button{background:#111;color:#fff;border:1px solid #333;padding:8px 12px;margin:4px;cursor:pointer;font-weight:700}
nav button.active{background:var(--yellow);color:#000}
main{padding:22px;max-width:1200px;margin:0 auto}
h1{font-size:clamp(28px,5vw,56px);line-height:.95;margin:0 0 12px;text-transform:uppercase}
.yellow{color:var(--yellow)}.red{color:var(--red)}
.rule{border-left:6px solid var(--yellow);padding:10px 14px;background:#111;margin:16px 0 28px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{border:1px solid var(--line);background:#0a0a0a;padding:14px}
.card h3{margin:0 0 8px;text-transform:uppercase}
.meta{color:var(--mute);font-size:13px}
input{width:100%;background:#111;color:#fff;border:1px solid #333;padding:8px;margin:6px 0 12px}
.status{display:inline-block;background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:3px 6px;margin-bottom:8px}
footer{border-top:1px solid #222;padding:16px 22px;color:var(--mute);font-size:12px}
.hidden{display:none}a{color:var(--yellow)}.card.pick{cursor:pointer}
</style>
</head>
<body>
<header>
<div class="brand">BRIK <span>INTEGRITY</span> / PROOF</div>
<nav>
<button class="tab active" data-view="integrity">Integrity</button>
<button class="tab" data-view="places">All places</button>
<button class="tab" data-view="proof">Proof</button>
<button class="tab" data-view="kits">Records kits</button>
<button class="tab" data-view="alerts">Alerts</button>
</nav>
</header>
<main>
<section id="view-integrity">
<h1>Follow the dollar <span class="yellow">after</span> award.</h1>
<p class="rule" id="heart"></p>
<div class="grid" id="metrics"></div>
<h2>Founding cases</h2>
<div class="grid" id="cases"></div>
</section>
<section id="view-places" class="hidden">
<h1>National place ledger</h1>
<p class="meta" id="place-meta"></p>
<input id="place-q" placeholder="Filter Alabama, Florida, Gulf County..." />
<div class="grid" id="place-list"></div>
<div id="place-detail" class="card"><p class="meta">Pick a place.</p></div>
</section>
<section id="view-proof" class="hidden">
<h1>BRIK <span class="red">PROOF</span></h1>
<div id="packets"></div>
</section>
<section id="view-kits" class="hidden">
<h1>Records kits</h1>
<div id="kits"></div>
</section>
<section id="view-alerts" class="hidden">
<h1>Alerts</h1>
<input id="alert-q" placeholder="Gulf County wastewater" />
<button class="tab" id="alert-save">Save alert</button>
<div id="alert-list"></div>
</section>
</main>
<footer>BRIK Creative, LLC. Campaign money never summed into grant totals. USAspending FY2025 pull 2026-09-05.</footer>
<script src="./places.js"></script>
<script src="./data.js"></script>
<script>
const $=id=>document.getElementById(id);
$('heart').textContent=BRIK.product.heart+' '+BRIK.product.rule;
$('metrics').innerHTML=Object.entries(BRIK.metrics).map(([k,v])=>`<article class="card"><div class="meta">${k}</div><h3>${v}</h3></article>`).join('');
$('cases').innerHTML=BRIK.cases.map(c=>`<article class="card"><span class="status">${c.status}</span><div class="meta">${c.awardClass} · ${c.place}</div><h3>${c.title}</h3><p><b>Promise:</b> ${c.promise}</p><p><b>Restricted use:</b> ${c.restrictedUse}</p><p><b>Parking:</b> ${c.contingent}</p><p><b>Disbursers:</b> ${c.disbursers.join('; ')}</p><p><b>Second hop:</b> ${c.secondHop.join('; ')}</p><p><b>Clock:</b> ${c.outcomes}</p></article>`).join('');
$('packets').innerHTML=BRIK.cases.map(c=>`<article class="card"><h3>Packet ${c.id}</h3><p>${c.title}</p><p>Sources: ${c.sources.join('; ')}</p></article>`).join('');
$('kits').innerHTML=BRIK.kits.map(k=>`<article class="card"><h3>${k.name}</h3><div class="meta">${k.statute}</div><ol>${k.steps.map(s=>`<li>${s}</li>`).join('')}</ol></article>`).join('');
$('place-meta').textContent=BRIK.places.length+' places · '+BRIK.metrics.states+' states · '+BRIK.product.period;
function renderPlaces(q=''){
  const qq=q.trim().toLowerCase();
  const list=BRIK.places.filter(p=>!qq || (p.name+' '+p.code+' '+p.kind).toLowerCase().includes(qq));
  $('place-list').innerHTML=list.map(p=>`<article class="card pick" data-id="${p.id}"><div class="meta">${p.kind} · ${p.code||''}</div><h3>${p.name}</h3><p>${p.usaSpendingLabel||''}</p></article>`).join('');
  $('place-list').querySelectorAll('.pick').forEach(el=>el.onclick=()=>showPlace(el.dataset.id));
}
function showPlace(id){
  const p=BRIK.places.find(x=>x.id===id); if(!p) return;
  const localCases=BRIK.cases.filter(c=>c.place===p.id || (p.code && c.placeCode===p.code));
  $('place-detail').innerHTML=`<div class="meta">${p.kind} · ${p.fy}</div><h3>${p.name}</h3>
  <p><b>1. Place page:</b> live.</p>
  <p><b>2. USAspending POP total:</b> ${p.usaSpendingLabel} · per capita ${p.perCapitaLabel} <a href="${p.usaSpendingUrl}" target="_blank" rel="noopener">source</a></p>
  <p><b>3. State overlay:</b> ${p.overlay&&p.overlay.url?`<a href="${p.overlay.url}" target="_blank" rel="noopener">${p.overlay.name}</a>`:p.overlay.name}</p>
  <p><b>4. Disburser graph:</b> ${p.disburserGraph}</p>
  <p><b>5. Second hop:</b> ${p.secondHop}</p>
  <p><b>6-7. Restricted use / parking:</b> ${p.parkingWatch}</p>
  <p><b>8. Outcome clock:</b> ${p.clock}</p>
  <p><b>9. Elections rail:</b> ${p.electionsRail.note}</p>
  <p><b>Cases here:</b> ${localCases.length?localCases.map(c=>c.title).join('; '):'None pinned yet.'}</p>`;
}
renderPlaces();
$('place-q').oninput=e=>renderPlaces(e.target.value);
const renderAlerts=()=>{const items=JSON.parse(localStorage.getItem('brik-alerts')||'[]');$('alert-list').innerHTML=items.map(t=>`<div class="card">${t}</div>`).join('')||'<p class="meta">None yet.</p>';};
$('alert-save').onclick=()=>{const q=$('alert-q').value.trim();if(!q)return;const items=JSON.parse(localStorage.getItem('brik-alerts')||'[]');items.unshift(q);localStorage.setItem('brik-alerts',JSON.stringify(items.slice(0,25)));$('alert-q').value='';renderAlerts();};
renderAlerts();
document.querySelectorAll('nav .tab').forEach(btn=>{btn.onclick=()=>{document.querySelectorAll('nav .tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');['integrity','proof','places','kits','alerts'].forEach(v=>{$('view-'+v).classList.toggle('hidden',v!==btn.dataset.view);});};});
</script>
</body></html>
